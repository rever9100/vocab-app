<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四级词库 · 错词抄写本</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F6FA">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="错词抄写本">
<style>
  /* All colors live in these variables. :root is the 浅色 theme; [data-theme="soft"] (柔和)
     and [data-theme="dark"] (黑暗) redefine them (see the theme section in the script).
     When adding a color, add it to all three sets — don't hard-code #fff etc. */
  :root{
    color-scheme: light;
    --bg: #F4F6FA;
    --surface: #FFFFFF;
    --surface-2: #F1F4F9;
    --border: #E3E8F0;
    --text: #1C2333;
    --text-soft: #667085;
    --accent: #4F6BED;
    --accent-soft: #EEF1FE;
    --on-accent: #FFFFFF;
    --success: #1F9D6B;
    --success-soft: #E6F6EF;
    --danger: #E5484D;
    --danger-soft: #FDECEC;
    --gold: #B7791F;
    --gold-soft: #FBF3E3;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 4px 16px rgba(16,24,40,0.06);
    --shadow-sm: 0 1px 2px rgba(16,24,40,0.08);
    --radius: 16px;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", "Cascadia Mono", "Consolas", "Courier New", monospace;
  }
  /* 柔和: warm beige, lower contrast, easy on the eyes */
  :root[data-theme="soft"]{
    color-scheme: light;
    --bg: #F3EEE3;
    --surface: #FBF8F1;
    --surface-2: #EFE8DA;
    --border: #E2D9C7;
    --text: #3B3A36;
    --text-soft: #7D776B;
    --accent: #5B7DB1;
    --accent-soft: #E5EAF2;
    --on-accent: #FFFFFF;
    --success: #4A8A5F;
    --success-soft: #E4EFE5;
    --danger: #C0574F;
    --danger-soft: #F6E3DE;
    --gold: #A07428;
    --gold-soft: #F3E8D2;
    --shadow: 0 1px 2px rgba(90,70,30,0.04), 0 4px 14px rgba(90,70,30,0.06);
    --shadow-sm: 0 1px 2px rgba(90,70,30,0.08);
  }
  /* 黑暗 */
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #0F1218;
    --surface: #181C25;
    --surface-2: #212734;
    --border: #2A3140;
    --text: #E8ECF3;
    --text-soft: #98A2B3;
    --accent: #7C93FF;
    --accent-soft: rgba(124,147,255,0.14);
    --on-accent: #10131A;   /* dark text: the lighter dark-mode accents are too bright for white text */
    --success: #3CCB8F;
    --success-soft: rgba(60,203,143,0.14);
    --danger: #FF6B6E;
    --danger-soft: rgba(255,107,110,0.14);
    --gold: #E3B341;
    --gold-soft: rgba(227,179,65,0.14);
    --shadow: 0 0 0 1px var(--border);
    --shadow-sm: 0 0 0 1px var(--border);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--text);
    min-height:100vh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(48px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{max-width:640px;margin:0 auto;}
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* header */
  .cover{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 18px 16px 22px;background:var(--surface);
    border-radius:var(--radius);box-shadow:var(--shadow);
    margin-bottom:14px;
  }
  .cover h1{font-size:20px;margin:0;font-weight:700;letter-spacing:0.2px;line-height:1.3;}
  .cover-title{flex:1;min-width:0;}
  .nowrap{white-space:nowrap;}   /* narrow phones: break the title only between book name and app name */
  .cover-side{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .theme-btn{
    border:none;cursor:pointer;border-radius:999px;padding:8px 12px;min-height:36px;
    background:var(--surface-2);color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;
  }
  .theme-btn:active{transform:scale(0.96);}
  @media (max-width: 380px){ .theme-btn .theme-name{display:none;} }
  .stamp{
    min-width:64px;padding:8px 10px;border-radius:12px;
    background:var(--accent-soft);color:var(--accent);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .stamp .num{font-size:22px;font-weight:800;line-height:1;}
  .stamp .lbl{font-size:10px;line-height:1;margin-top:4px;color:var(--text-soft);}

  /* daily progress */
  .daily-bar{margin:0 4px 14px;}
  .daily-text{font-size:12px;color:var(--text-soft);margin-bottom:6px;text-align:center;}
  .daily-track{height:8px;background:var(--border);border-radius:999px;overflow:hidden;}
  .daily-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .3s;}

  /* tally */
  .tally{
    display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);
    border-radius:var(--radius);box-shadow:var(--shadow);
    margin-bottom:14px;padding:6px;
  }
  .tally .item{text-align:center;padding:10px 4px;}
  .tally .item .n{font-size:22px;font-weight:800;line-height:1.2;}
  .tally .item .l{font-size:11px;color:var(--text-soft);margin-top:2px;}
  .tally .item:nth-child(2) .n{color:var(--accent);}
  .tally .item:nth-child(3) .n{color:var(--success);}
  .tally .item:nth-child(4) .n{color:var(--danger);}

  /* tabs: segmented control */
  .tabs{display:flex;gap:4px;margin-bottom:14px;padding:4px;background:var(--surface-2);border-radius:14px;}
  .tab-btn{
    flex:1;padding:9px 2px;text-align:center;border:none;cursor:pointer;border-radius:10px;
    background:transparent;color:var(--text-soft);
    font-size:13px;font-weight:600;transition:background .15s,color .15s;
  }
  .tab-btn.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm);}

  /* main panel */
  .paper{
    background:var(--surface);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:24px 20px;
    min-height:340px;
  }

  /* study card */
  .flashcard{text-align:center;padding:12px 0 4px;}
  .fc-mode{
    display:inline-block;font-size:12px;font-weight:600;letter-spacing:1px;
    color:var(--accent);background:var(--accent-soft);
    padding:4px 12px;border-radius:999px;margin-bottom:18px;
  }
  .fc-word{font-size:40px;font-weight:800;line-height:1.2;margin:4px 0 20px;word-break:break-word;letter-spacing:0.3px;}
  /* 中译英 shows the Chinese meaning as the prompt; meanings can be long, so smaller than an English word */
  .fc-word-zh{font-size:24px;font-weight:700;line-height:1.5;letter-spacing:0;}
  .fc-reveal{font-size:18px;font-weight:500;line-height:1.6;color:var(--text);margin:8px 0 14px;min-height:28px;}
  .fc-ex{text-align:left;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:4px 0 12px;}
  .fc-example{font-size:14px;line-height:1.6;color:var(--text);}
  .fc-example-cn{font-size:13px;line-height:1.6;color:var(--text-soft);margin-top:2px;}
  .fc-hint{font-family:var(--font-mono);font-size:18px;letter-spacing:2px;color:var(--text-soft);margin-top:12px;}
  .fc-phonetic{font-size:14px;color:var(--text-soft);margin:-12px 0 16px;}
  .feedback + .fc-phonetic{margin:10px 0 12px;}
  .fc-phrases{text-align:left;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:0 0 12px;}
  .fc-phrases-title{font-size:12px;color:var(--text-soft);margin-bottom:4px;}
  .fc-phrase{font-size:13.5px;line-height:1.7;color:var(--text-soft);}
  .fc-phrase .en{color:var(--text);font-weight:600;margin-right:4px;}
  .file-btn{display:inline-flex;align-items:center;}
  .speak-btn{
    border:none;background:transparent;cursor:pointer;padding:2px 6px;margin-left:4px;
    font-size:0.6em;vertical-align:middle;line-height:1;border-radius:8px;
  }
  .speak-btn:hover{background:var(--surface-2);}
  .fc-example .speak-btn,.feedback .speak-btn,.copy-title .speak-btn{font-size:15px;}

  input[type=text]{
    font-family:var(--font-mono);font-size:20px;padding:12px 16px;
    border:1.5px solid transparent;border-radius:12px;
    width:100%;max-width:300px;text-align:center;color:var(--text);
    background:var(--surface-2);transition:border-color .15s,box-shadow .15s;
  }
  input[type=text]:focus, textarea:focus, .num-input:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);
  }

  .btn{
    font-weight:600;font-size:15px;min-height:44px;
    border:none;border-radius:12px;padding:10px 22px;cursor:pointer;
    transition:transform .1s, filter .15s;
  }
  .btn:hover{filter:brightness(1.05);}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.5;cursor:default;transform:none;}
  .btn-primary{background:var(--accent);color:var(--on-accent);}
  .btn-green{background:var(--success);color:var(--on-accent);}
  .btn-red{background:var(--danger);color:var(--on-accent);}
  .btn-ghost{background:var(--surface-2);color:var(--text);}
  .btn-row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}

  .feedback{
    display:inline-block;margin-top:12px;font-size:15px;font-weight:600;line-height:1.5;
    padding:10px 16px;border-radius:12px;animation:pop .2s ease-out;
  }
  .feedback.correct{color:var(--success);background:var(--success-soft);}
  .feedback.wrong{color:var(--danger);background:var(--danger-soft);}
  @keyframes pop{from{transform:scale(0.94);opacity:0;}to{transform:scale(1);opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .feedback{animation:none;} }

  /* copy task (田字格) */
  .copy-title{font-size:15px;font-weight:700;margin-bottom:4px;line-height:1.5;}
  .copy-sub{font-size:13px;color:var(--text-soft);margin-bottom:18px;}
  .grid-row{display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
  .grid-row .rep-label{width:20px;font-size:12px;color:var(--text-soft);font-weight:700;}
  .cell{
    width:34px;height:34px;border:1.5px solid var(--border);border-radius:8px;
    position:relative;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:16px;font-weight:700;background:var(--surface);color:var(--text);
  }
  .cell::before,.cell::after{content:"";position:absolute;background:var(--border);opacity:0.7;}
  .cell::before{left:50%;top:0;bottom:0;width:1px;}
  .cell::after{top:50%;left:0;right:0;height:1px;}
  .cell.done{border-color:var(--success);color:var(--success);background:var(--success-soft);}
  .cell.pending{color:transparent;}
  .rep-mark{width:22px;text-align:center;font-size:16px;}
  .rep-mark.ok{color:var(--success);}
  .copy-input-wrap{margin-top:12px;}

  /* lists */
  /* wrong-book row: word / count / button on top, meaning on its own full-width line below */
  .word-row{
    display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"en cnt btn" "zh zh zh";
    align-items:center;column-gap:10px;row-gap:4px;
    padding:12px 4px;border-bottom:1px solid var(--border);font-size:14px;
  }
  .word-row:last-child{border-bottom:none;}
  .word-row .en{grid-area:en;font-family:var(--font-mono);font-weight:700;font-size:15px;word-break:break-word;}
  .word-row .zh{grid-area:zh;color:var(--text-soft);font-size:13px;line-height:1.5;}
  .word-row .cnt{grid-area:cnt;color:var(--danger);font-weight:700;font-size:12px;white-space:nowrap;}
  .word-row .mini-btn{grid-area:btn;}
  .mini-btn{
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:none;
    background:var(--accent-soft);color:var(--accent);cursor:pointer;white-space:nowrap;
  }
  .mini-btn:active{transform:scale(0.97);}
  .empty{text-align:center;color:var(--text-soft);padding:60px 10px;font-size:14px;line-height:1.7;}

  /* import / settings */
  textarea{
    width:100%;min-height:120px;font-family:var(--font-mono);font-size:13px;
    padding:12px 14px;border:1.5px solid transparent;border-radius:12px;resize:vertical;
    background:var(--surface-2);color:var(--text);
  }
  input[type=file]{font-size:13px;color:var(--text-soft);max-width:100%;}
  input[type=file]::file-selector-button{
    font:inherit;font-weight:600;margin-right:10px;padding:8px 14px;border:none;border-radius:10px;
    background:var(--accent-soft);color:var(--accent);cursor:pointer;
  }
  input[type=checkbox], input[type=radio]{accent-color:var(--accent);width:16px;height:16px;flex-shrink:0;}
  .hint{font-size:12.5px;color:var(--text-soft);line-height:1.7;margin-bottom:10px;}
  .field{margin-bottom:22px;}
  .field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;}
  .msg{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:12px;line-height:1.6;}
  .msg.ok{background:var(--success-soft);color:var(--success);}
  .msg.warn{background:var(--danger-soft);color:var(--danger);}
  .num-input{
    width:80px;font-family:var(--font-mono);font-size:16px;padding:8px 10px;
    border:1.5px solid transparent;border-radius:10px;text-align:center;
    background:var(--surface-2);color:var(--text);
  }
  .checkline{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;line-height:1.5;}
  .save-note{font-size:12.5px;color:var(--text-soft);background:var(--surface-2);border-radius:10px;padding:8px 12px;margin-bottom:18px;transition:color .2s,background .2s;}
  .save-note.saved{color:var(--success);background:var(--success-soft);}
  .hint.estimate{margin:10px 0 0;color:var(--text);}
  .hint.estimate b{color:var(--accent);}
  /* unit range picker gets its own full-width line under a book row */
  .book-row{flex-wrap:wrap;}
  .book-main{flex:1;min-width:0;}
  .book-extra{flex-basis:100%;}
  .unit-range{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap;margin-top:2px;color:var(--text-soft);}
  .unit-select{
    font:inherit;font-size:14px;padding:6px 8px;border:1.5px solid transparent;border-radius:10px;
    background:var(--surface-2);color:var(--text);
  }
  .unit-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  .loading{text-align:center;padding:80px 10px;color:var(--text-soft);font-size:14px;}
  .warn-banner{
    background:var(--danger-soft);color:var(--danger);
    border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:14px;
  }
  .done-screen{text-align:center;padding:50px 10px;}
  .done-screen .big{font-size:44px;margin-bottom:12px;}
  .done-screen .msg-line{font-size:15px;color:var(--text-soft);margin-bottom:20px;}
  .book-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 12px;border-bottom:1px solid var(--border);}
  .book-row:last-child{border-bottom:none;}
  .book-row.active{background:var(--accent-soft);border-radius:12px;border-bottom-color:transparent;}
  .book-name{font-size:16px;font-weight:700;}
  .book-stat{font-size:12px;color:var(--text-soft);margin-top:4px;}
  .book-badge{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--surface-2);
    color:var(--text-soft);vertical-align:middle;margin-left:4px;font-weight:600;}
  .book-badge.custom{background:var(--gold-soft);color:var(--gold);}
  .book-current{font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap;}
</style>
<script>
  // Set the color theme before the page paints so it doesn't flash the wrong colors.
  // Same rule as resolvedTheme() in the main script: 'auto' = 黑暗 if the system is dark, else 柔和.
  (function(){
    var t = 'auto';
    try{ t = localStorage.getItem('vocab-app-theme') || 'auto'; }catch(e){}
    if(t === 'auto') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'soft';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<div class="wrap" id="app"><div class="loading">正在打开错词本…</div></div>

<script src="wordbooks-data.js"></script>
<script src="wordbooks-extra.js"></script>
<script>
(function(){
  var STORAGE_KEY = 'vocab-app-state-v1';

  var REVIEW_INTERVALS = [1, 2, 4, 7, 15, 30]; // days — simplified Ebbinghaus-style schedule
  var CUSTOM_BOOK_ID = 'custom';

  // Built-in entries whose spelling was corrupted in older wordbooks-data.js and has since
  // been corrected (old lowercase en -> new en). Progress saved under the old spelling is
  // carried over to the corrected word by syncBuiltinBooks().
  var RENAMED_WORDS = {
    cet4: { 'inser': 'insert' },
    cet6: {
      'rmost': 'outermost', 'outeintegral': 'integral', 'iinfinitely': 'infinitely',
      'ndefinite': 'indefinite', 'ile': 'tile', 'twatt': 'watt', 'mishief': 'mischief',
      'f': 'fringe', 'refereen': 'referee', 'pendulumn': 'pendulum', 'shuttlen': 'shuttle',
      'marketvt': 'market', 'shrimpn': 'shrimp', 'deviatevt': 'deviate', 'hoarsea': 'hoarse',
      'eclipsen': 'eclipse', 'loungen': 'lounge', 'realizationn': 'realization',
      'bishopn': 'bishop', 'earn': 'ear', 'tightenvt': 'tighten', 'fretvt': 'fret',
      'revolvevt': 'revolve'
    }
  };

  // Built-in wordbooks come from wordbooks-data.js (window.BUILTIN_WORDBOOKS).
  // We build a list of book metadata plus a lookup for their word arrays.
  function builtinBooks(){
    var src = window.BUILTIN_WORDBOOKS || {};
    var list = [];
    Object.keys(src).forEach(function(k){
      list.push({ id: src[k].id, name: src[k].name, builtin: true, words: src[k].words, units: src[k].units || 0 });
    });
    return list;
  }

  // Dates are 'YYYY-MM-DD' in the user's local time zone. Don't use toISOString() here:
  // it converts to UTC, which in China (UTC+8) rolls the day over at 8am and makes
  // addDays() come out one day short.
  function localDateStr(d){
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function todayStr(){ return localDateStr(new Date()); }
  function addDays(dateStr, n){
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return localDateStr(d);
  }
  // A word belongs to a book (book = book id). id is unique per book: book + ':' + en.
  function makeWord(book, en, zh, example, exampleCn, unit){
    return {
      id: book + ':' + en.toLowerCase(),
      book: book,
      en: en, zh: zh, example: example||'', exampleCn: exampleCn||'',
      unit: unit || null,     // unit number in books split into units (词达人), else null
      wrongCount: 0,
      introducedDate: null,   // null = never studied yet
      reviewStage: 0,         // index into REVIEW_INTERVALS, how many successful reviews passed
      nextReviewDate: null
    };
  }
  function defaultState(){
    var books = builtinBooks();
    var firstBook = books.length ? books[0].id : CUSTOM_BOOK_ID;
    var st = {
      words: [],                    // all words the user has actually loaded, across books
      loadedBooks: {},              // bookId -> true once its words are inserted into state.words
      activeBook: firstBook,        // which book the study tab is currently working through
      customBookName: '我的词库',
      settings: { threshold: 2, modeEn2Zh: true, modeZh2En: true, dailyNewGoal: 30, copyMode: 'off', unitRange: {} },
      streakDays: 0,
      lastActiveDate: null,
      dailyProgress: { date: null, newIntroducedCount: 0, reviewsDoneToday: 0 }
    };
    return st;
  }

  // Ensure a built-in book's words are present in state.words (lazy, only when first needed).
  function ensureBookLoaded(bookId){
    if(state.loadedBooks[bookId]) return;
    var book = builtinBooks().filter(function(b){ return b.id === bookId; })[0];
    if(!book){ state.loadedBooks[bookId] = true; return; }
    var existing = {};
    state.words.forEach(function(w){ if(w.book === bookId) existing[w.id] = true; });
    book.words.forEach(function(pair){
      var w = makeWord(bookId, pair[0], pair[1], pair[2] || '', pair[3] || '', pair[4]);
      if(!existing[w.id]){ state.words.push(w); existing[w.id] = true; }
    });
    state.loadedBooks[bookId] = true;
  }

  // Saved words carry their own copy of the meaning and examples, so when wordbooks-data.js
  // is improved (new examples, fixed typos) those copies go stale. On load, refresh every
  // already-loaded built-in book from the current data, keeping each word's study progress.
  function syncBuiltinBooks(){
    builtinBooks().forEach(function(book){
      if(!state.loadedBooks[book.id]) return;
      var renamed = RENAMED_WORDS[book.id] || {};
      var src = {};
      book.words.forEach(function(p){
        var id = book.id + ':' + p[0].toLowerCase();
        if(!src[id]) src[id] = p;
      });
      var kept = {};
      state.words = state.words.filter(function(w){
        if(w.book !== book.id) return true;
        var en = (w.en || '').toLowerCase();
        var id = book.id + ':' + (renamed[en] || en);
        var p = src[id];
        if(!p || kept[id]) return false;   // no longer in the book, or a duplicate
        kept[id] = true;
        w.id = id; w.en = p[0]; w.zh = p[1]; w.example = p[2] || ''; w.exampleCn = p[3] || ''; w.unit = p[4] || null;
        return true;
      });
      book.words.forEach(function(p){
        var w = makeWord(book.id, p[0], p[1], p[2] || '', p[3] || '', p[4]);
        if(!kept[w.id]){ state.words.push(w); kept[w.id] = true; }
      });
    });
  }

  // All books available to pick from: built-ins + a custom book if the user imported anything.
  function allBooks(){
    var list = builtinBooks().map(function(b){ return { id: b.id, name: b.name, builtin: true }; });
    var hasCustom = state.words.some(function(w){ return w.book === CUSTOM_BOOK_ID; });
    if(hasCustom || state.activeBook === CUSTOM_BOOK_ID){
      list.push({ id: CUSTOM_BOOK_ID, name: state.customBookName || '我的词库', builtin: false });
    }
    return list;
  }

  // Words belonging to the currently active book.
  function activeWords(){
    return state.words.filter(function(w){ return w.book === state.activeBook; });
  }

  // Books split into units (词达人四级) let the user limit which units NEW words come from
  // (settings.unitRange[bookId] = {from, to}). Already-learned words keep their review
  // schedule regardless of the range — the user chose that, so they don't forget them.
  function bookUnitCount(bookId){
    var b = builtinBooks().filter(function(x){ return x.id === bookId; })[0];
    return b ? b.units : 0;
  }
  function unitRange(bookId){   // null for books without units
    var n = bookUnitCount(bookId);
    if(!n) return null;
    var r = (state.settings.unitRange || {})[bookId] || {};
    var from = Math.min(Math.max(parseInt(r.from, 10) || 1, 1), n);
    var to = Math.min(Math.max(parseInt(r.to, 10) || n, from), n);
    return { from: from, to: to, total: n, limited: from > 1 || to < n };
  }
  function inRange(w, r){ return !r || !w.unit || (w.unit >= r.from && w.unit <= r.to); }
  function unitRangeLabel(r){ return r.from === r.to ? 'Unit ' + r.from : 'Unit ' + r.from + '–' + r.to; }
  // New words still to learn in a book (inside its unit range), and how many days that takes.
  // `r` defaults to the saved range; the settings page passes the not-yet-saved one for a live preview.
  function remainingNewWords(bookId, r){
    if(r === undefined) r = unitRange(bookId);
    return state.words.filter(function(w){ return w.book === bookId && !w.introducedDate && inRange(w, r); }).length;
  }
  function daysToFinish(remaining, perDay){ return perDay > 0 ? Math.ceil(remaining / perDay) : 0; }
  function finishEstimateText(bookId, perDay, r){
    if(r === undefined) r = unitRange(bookId);
    var n = remainingNewWords(bookId, r);
    var where = r && r.limited ? '（' + unitRangeLabel(r) + '）' : '';
    if(n === 0) return '这本词书' + where + '的新词已经全部学过了，接下来按计划复习就行。';
    return '这本词书' + where + '还剩 ' + n + ' 个新词，按每天 ' + perDay + ' 个，大约 <b>' + daysToFinish(n, perDay) + ' 天</b>学完。';
  }

  var state = null;       // persisted data
  var ui = {               // transient UI state, not persisted
    activeTab: 'study',
    currentWord: null,
    currentMode: null,
    revealAnswer: false,
    feedback: null,        // {type:'correct'|'wrong', text}
    feedbackShownAt: 0,    // when a wrong-answer screen appeared (ms), see the Enter shortcut in init()
    copyTask: null,        // {word, repsDone:[bool,bool,bool], activeRep, error}
    importMsg: null,
    importDraftText: '',
    storageAvailable: true,
    saveFailed: false,     // last persist() threw (e.g. storage full)
    currentRecheck: false, // the card on screen is a same-day re-check (set in nextCard)
    backupMsg: null,       // result line under 设置 → 备份
    hintShown: false,      // 中译英 hint revealed for the current card
    bonusMode: false,
    lastWordId: null
  };

  // Local storage shim (offline-capable) — mimics the same async get/set interface
  // the rest of the app already uses, so the app logic below needed no other changes.
  var localStore = {
    get: function(key){
      return new Promise(function(resolve, reject){
        try{
          var v = localStorage.getItem(key);
          if(v === null){ reject(new Error('not found')); return; }
          resolve({ key: key, value: v });
        }catch(e){ reject(e); }
      });
    },
    set: function(key, value){
      return new Promise(function(resolve, reject){
        try{
          localStorage.setItem(key, value);
          resolve({ key: key, value: value });
        }catch(e){ reject(e); }
      });
    }
  };

  var storageOK = (function(){
    try{
      var t = '__vocab_app_probe__';
      localStorage.setItem(t, '1');
      localStorage.removeItem(t);
      return true;
    }catch(e){ return false; }
  })();

  async function loadState(){
    if(!storageOK){ state = defaultState(); return; }
    try{
      var res = await localStore.get(STORAGE_KEY);
      if(res && res.value){
        var parsed = JSON.parse(res.value);
        if(parsed && Array.isArray(parsed.words) && parsed.words.length){
          state = parsed;
          lastSavedJson = res.value;
          migrateState();
          return;
        }
      }
    }catch(e){ /* no data yet, fall through to default */ }
    state = defaultState();
    await persist();
  }

  function migrateState(){
    if(!state.settings) state.settings = {};
    if(state.settings.threshold == null) state.settings.threshold = 2;
    if(state.settings.modeEn2Zh == null) state.settings.modeEn2Zh = true;
    if(state.settings.modeZh2En == null) state.settings.modeZh2En = true;
    if(state.settings.dailyNewGoal == null) state.settings.dailyNewGoal = 30;
    if(state.settings.copyMode == null) state.settings.copyMode = 'off';
    if(!state.settings.unitRange) state.settings.unitRange = {};
    if(!state.loadedBooks) state.loadedBooks = {};
    if(!state.customBookName) state.customBookName = '我的词库';
    if(!Array.isArray(state.words)) state.words = [];
    state.words.forEach(function(w){
      // Words saved before wordbooks existed have no `book`; treat them as custom imports.
      if(w.book === undefined){ w.book = CUSTOM_BOOK_ID; }
      if(w.id === undefined || w.id.indexOf(':') === -1){ w.id = w.book + ':' + (w.en||'').toLowerCase(); }
      if(w.introducedDate === undefined) w.introducedDate = (w.correctStreak ? todayStr() : null);
      if(w.reviewStage === undefined) w.reviewStage = 0;
      if(w.nextReviewDate === undefined) w.nextReviewDate = w.introducedDate ? todayStr() : null;
      if(w.wrongCount == null) w.wrongCount = 0;
      if(w.exampleCn === undefined) w.exampleCn = '';
      delete w.correctStreak;
    });
    // Mark custom as loaded if any custom words exist; built-in books stay lazy.
    if(state.words.some(function(w){ return w.book === CUSTOM_BOOK_ID; })){
      state.loadedBooks[CUSTOM_BOOK_ID] = true;
    }
    // If the active book points at a built-in, make sure its words are present.
    if(!state.activeBook){
      var books = builtinBooks();
      state.activeBook = books.length ? books[0].id : CUSTOM_BOOK_ID;
    }
    if(!state.dailyProgress) state.dailyProgress = { date:null, newIntroducedCount:0, reviewsDoneToday:0 };
    syncBuiltinBooks();
    ensureBookLoaded(state.activeBook);
  }

  function ensureDailyProgress(){
    var today = todayStr();
    if(!state.dailyProgress || state.dailyProgress.date !== today){
      // cardsDone: cards graded today (paces the same-day re-checks); extraNew: "再学 10 个新词"
      state.dailyProgress = { date: today, newIntroducedCount: 0, reviewsDoneToday: 0, cardsDone: 0, extraNew: 0 };
    }
  }

  var lastSavedJson = null;   // what this window last read or wrote, see reloadIfChangedElsewhere()
  async function persist(){
    if(!storageOK) return;
    try{
      var json = JSON.stringify(state);
      await localStore.set(STORAGE_KEY, json);
      lastSavedJson = json;
      ui.saveFailed = false;
    }catch(e){
      console.error('保存失败', e);
      ui.saveFailed = true;   // shown as a banner on the next render
    }
  }

  // Another window of the app (e.g. the installed app and a browser tab) may have saved newer
  // data while this one sat in the background. Pick that up, instead of overwriting it with this
  // window's stale copy on the next answer — that used to undo settings changed elsewhere.
  function reloadIfChangedElsewhere(){
    if(!storageOK || !state) return;
    var v;
    try{ v = localStorage.getItem(STORAGE_KEY); }catch(e){ return; }
    if(!v || v === lastSavedJson) return;
    try{
      var parsed = JSON.parse(v);
      if(!parsed || !Array.isArray(parsed.words)) return;
      state = parsed;
      lastSavedJson = v;
      migrateState();
    }catch(e){ return; }
    ui.currentWord = null; ui.feedback = null; ui.revealAnswer = false; ui.copyTask = null; ui.bonusMode = false;
    render();
  }

  // The streak counts days the user actually answered something (called from grade()).
  function updateStreak(){
    var today = todayStr();
    if(state.lastActiveDate === today) return;
    if(state.lastActiveDate){
      var prev = new Date(state.lastActiveDate);
      var diffDays = Math.round((new Date(today) - prev) / 86400000);
      state.streakDays = (diffDays === 1) ? (state.streakDays||0) + 1 : 1;
    } else {
      state.streakDays = 1;
    }
    state.lastActiveDate = today;
  }
  // A streak that ended before yesterday is already broken, so show 0 until the next answer.
  function displayStreak(){
    var today = todayStr();
    if(state.lastActiveDate === today || state.lastActiveDate === addDays(today, -1)) return state.streakDays || 0;
    return 0;
  }

  function wordStatus(w){
    if(!w.introducedDate) return 'new';
    if(w.reviewStage >= REVIEW_INTERVALS.length) return 'mastered';
    return 'learning';
  }
  function counts(){
    var c = { new:0, learning:0, mastered:0, wrongbook:0 };
    activeWords().forEach(function(w){
      c[wordStatus(w)]++;
      if(w.wrongCount > 0) c.wrongbook++;
    });
    return c;
  }

  // Daily new-word quota is shared across the whole app (not per-book), so studying two
  // books in one day still respects a single "30 new words a day" budget. "再学 10 个新词"
  // on the done screen adds to it for the day (dailyProgress.extraNew).
  function dailyNewQuota(){ return (state.settings.dailyNewGoal || 0) + (state.dailyProgress.extraNew || 0); }

  // Same-day re-check, closer to the Ebbinghaus curve's short intervals: a word learned today,
  // or any word answered wrong, comes back once more later today, after RELEARN_GAP other
  // cards (word.againDate = today, word.againAfter = dailyProgress.cardsDone threshold).
  var RELEARN_GAP = 5;
  function againToday(){
    var today = todayStr();
    return state.words.filter(function(w){ return w.againDate === today; });
  }
  // Reviews come from every book, not just the active one, so words learned in another book
  // don't pile up unseen after switching books. New words only come from the active book.
  function dueReviews(){
    var today = todayStr();
    return state.words.filter(function(w){
      return w.introducedDate && w.nextReviewDate && w.nextReviewDate <= today && w.againDate !== today;
    });
  }

  // pool=='today': due reviews (all books) + same-day re-checks + today's new-word quota (active book)
  // pool=='bonus': any already-introduced word in the active book, ignoring due dates
  function pickWord(poolMode){
    ensureDailyProgress();
    var pool0 = activeWords();
    if(poolMode === 'bonus'){
      var bonusPool = pool0.filter(function(w){ return w.introducedDate; });
      if(bonusPool.length === 0) return null;
      if(ui.lastWordId && bonusPool.length > 1){
        var bf = bonusPool.filter(function(w){ return w.id !== ui.lastWordId; });
        if(bf.length > 0) bonusPool = bf;
      }
      return bonusPool[Math.floor(Math.random()*bonusPool.length)];
    }
    var dueWords = dueReviews();
    var remainingQuota = Math.max(0, dailyNewQuota() - state.dailyProgress.newIntroducedCount);
    var range = unitRange(state.activeBook);   // new words only come from the chosen units
    var newWords = remainingQuota > 0
      ? pool0.filter(function(w){ return !w.introducedDate && inRange(w, range); }).slice(0, remainingQuota)
      : [];
    var cardsDone = state.dailyProgress.cardsDone || 0;
    var again = againToday();
    var againReady = again.filter(function(w){ return cardsDone >= (w.againAfter || 0); });
    var pool = dueWords.concat(newWords, againReady);
    if(pool.length === 0) pool = again;   // nothing else left: re-check the rest now
    if(pool.length === 0) return null;
    // Avoid showing the exact same word twice in a row: if there's more than one
    // candidate, drop the previous word from this draw. (If it's the only one left,
    // we have no choice but to repeat it.)
    if(ui.lastWordId && pool.length > 1){
      var filtered = pool.filter(function(w){ return w.id !== ui.lastWordId; });
      if(filtered.length > 0) pool = filtered;
    }
    var weighted = [];
    pool.forEach(function(w){ for(var i=0;i<(w.wrongCount+1);i++) weighted.push(w); });
    return weighted[Math.floor(Math.random()*weighted.length)];
  }

  function pickMode(){
    var modes = [];
    if(state.settings.modeEn2Zh) modes.push('en2zh');
    if(state.settings.modeZh2En) modes.push('zh2en');
    if(modes.length === 0) modes = ['en2zh'];
    return modes[Math.floor(Math.random()*modes.length)];
  }

  function nextCard(){
    ui.feedback = null;
    ui.revealAnswer = false;
    ui.hintShown = false;
    var w = pickWord(ui.bonusMode ? 'bonus' : 'today');
    if(w) ui.lastWordId = w.id;
    ui.currentWord = w;
    // decided when the card is drawn, so grading it doesn't relabel the answer screen
    ui.currentRecheck = !!(w && !ui.bonusMode && w.againDate === todayStr());
    ui.currentMode = w ? pickMode() : null;
  }

  async function grade(word, correct){
    ensureDailyProgress();
    var today = todayStr();
    var wasNew = !word.introducedDate;
    var recheck = !ui.bonusMode && word.againDate === today;   // the same-day second look
    if(wasNew){
      word.introducedDate = today;
      state.dailyProgress.newIntroducedCount++;
    } else if(!ui.bonusMode && !recheck){
      state.dailyProgress.reviewsDoneToday++;
    }
    if(!ui.bonusMode) state.dailyProgress.cardsDone = (state.dailyProgress.cardsDone || 0) + 1;
    updateStreak();
    if(correct){
      // Extra practice ("bonus") and the same-day re-check don't move the schedule forward,
      // otherwise a word could be pushed toward "mastered" without the spaced intervals.
      if(!ui.bonusMode && !recheck){
        var s = word.reviewStage || 0;
        if(s < REVIEW_INTERVALS.length){
          word.nextReviewDate = addDays(today, REVIEW_INTERVALS[s]);
          word.reviewStage = s + 1;
        } else {
          word.nextReviewDate = addDays(today, 60); // occasional booster for already-mastered words
        }
      }
      ui.feedback = { type:'correct', text:'✓ 答对了' };
    } else {
      word.reviewStage = 0;
      word.nextReviewDate = addDays(today, REVIEW_INTERVALS[0]);
      word.wrongCount = (word.wrongCount||0) + 1;
      // Show whichever side the user was being asked to produce.
      var answer = (ui.currentMode === 'en2zh')
        ? (word.en + ' → ' + word.zh)
        : (word.zh + ' → ' + word.en);
      ui.feedback = { type:'wrong', text:'✗ 答错了 · ' + answer };
    }
    if(!ui.bonusMode){
      if(!correct || (wasNew && correct)){
        word.againDate = today;
        word.againAfter = state.dailyProgress.cardsDone + RELEARN_GAP;
      } else if(recheck){
        word.againDate = null;   // passed the re-check
      }
    }
    await persist();
    if(!correct) ui.feedbackShownAt = Date.now();
    render();
    // A correct answer moves on by itself. A wrong one stays on screen until the user
    // taps OK (or presses Enter), so there's time to actually look at the answer.
    if(correct) setTimeout(function(){ nextCard(); render(); }, 500);
  }

  function needsCopyTask(word){
    return state.settings.copyMode !== 'off' && word.wrongCount >= state.settings.threshold;
  }

  function continueAfterWrong(){
    var word = ui.currentWord;
    if(word && needsCopyTask(word)){ startCopyTask(word); return; }
    nextCard();
    render();
  }

  function startCopyTask(word){
    ui.copyTask = { word: word, repsDone: [false,false,false], activeRep: 0, error:false, input:'' };
    render();
  }

  async function finishCopyTask(){
    var word = ui.copyTask.word;
    var today = todayStr();
    word.wrongCount = 0;
    word.reviewStage = 0;
    word.nextReviewDate = addDays(today, REVIEW_INTERVALS[0]);
    ui.copyTask = null;
    await persist();
    nextCard();
    render();
  }

  function submitCopyRep(value){
    var ct = ui.copyTask;
    if(spellingMatches(value, ct.word.en)){
      ct.repsDone[ct.activeRep] = true;
      ct.error = false;
      if(ct.repsDone.every(function(x){return x;})){
        finishCopyTask();
        return;
      }
      ct.activeRep++;
    } else {
      ct.error = true;
    }
    render();
  }

  // Handwrite mode: user copies on paper, taps one button to finish the whole task.
  function markHandwriteRep(){
    var ct = ui.copyTask;
    ct.repsDone = [true, true, true];
    finishCopyTask();
  }

  // ---------- spelling ----------
  // Harmless differences don't count as wrong: case, dots (a.m / am), hyphen vs space
  // (ice-cream / ice cream). A bracketed part is optional: onward(s) accepts onward,
  // onwards, and onward(s) typed literally. Slash means either spelling: mold/mould,
  // offense/offence (from the 词达人 book).
  function normalizeSpelling(s){
    return (s||'').toLowerCase().replace(/\./g, '').replace(/[-\s]+/g, ' ').trim();
  }
  function spellingVariants(en){
    var out = [];
    en.split('/').forEach(function(alt){
      var m = alt.match(/^(.*)\(([^)]*)\)(.*)$/);
      if(m) out.push(m[1] + m[3], m[1] + m[2] + m[3], alt);
      else out.push(alt);
    });
    if(out.length > 1) out.push(en);
    return out;
  }
  function spellingMatches(input, en){
    var a = normalizeSpelling(input);
    if(!a) return false;
    return spellingVariants(en).some(function(v){ return normalizeSpelling(v) === a; });
  }
  // 中译英 hint: first letter, then one underscore per letter; hyphens, spaces and dots stay.
  function spellingHint(en){
    var base = spellingVariants(en)[0];
    var letters = 0;
    var shown = base.split('').map(function(ch, i){
      if(!/[a-z]/i.test(ch)) return ch;
      letters++;
      return i === 0 ? ch : '_';
    }).join(' ');
    return shown + '（' + letters + ' 个字母）';
  }

  // ---------- theme ----------
  // Stored on its own key, not in `state`: the <head> script needs it before the app loads,
  // and "重置全部进度" shouldn't reset the colors. 'auto' follows the system (dark → 黑暗,
  // otherwise 柔和); keep that rule in sync with the <head> script.
  var THEME_KEY = 'vocab-app-theme';
  var THEMES = [
    { id:'light', name:'浅色', icon:'☀️' },
    { id:'soft',  name:'柔和', icon:'🌿' },
    { id:'dark',  name:'黑暗', icon:'🌙' }
  ];
  var THEME_BAR_COLORS = { light:'#F4F6FA', soft:'#F3EEE3', dark:'#0F1218' };
  var darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function themeSetting(){
    try{ return localStorage.getItem(THEME_KEY) || 'auto'; }catch(e){ return 'auto'; }
  }
  function resolvedTheme(){
    var t = themeSetting();
    if(t === 'light' || t === 'soft' || t === 'dark') return t;
    return (darkQuery && darkQuery.matches) ? 'dark' : 'soft';
  }
  function themeInfo(id){ return THEMES.filter(function(t){ return t.id === id; })[0] || THEMES[1]; }
  function applyTheme(){
    var t = resolvedTheme();
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', THEME_BAR_COLORS[t]);
  }
  function setTheme(t){
    try{ localStorage.setItem(THEME_KEY, t); }catch(e){ /* not saved, still applies for this visit */ }
    applyTheme();
    render();
  }
  // Header button: 浅色 → 柔和 → 黑暗 → 浅色 …
  function cycleTheme(){
    var ids = THEMES.map(function(t){ return t.id; });
    setTheme(ids[(ids.indexOf(resolvedTheme()) + 1) % ids.length]);
  }

  // ---------- pronunciation ----------
  var canSpeak = ('speechSynthesis' in window) && typeof SpeechSynthesisUtterance !== 'undefined';
  function speak(text){
    if(!canSpeak || !text) return;
    try{
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      var voices = speechSynthesis.getVoices().filter(function(v){ return /^en([-_]|$)/i.test(v.lang); });
      var us = voices.filter(function(v){ return /^en[-_]us$/i.test(v.lang); });
      if(us.length || voices.length) u.voice = (us[0] || voices[0]);
      speechSynthesis.speak(u);
    }catch(e){ /* no speech on this device, just stay silent */ }
  }
  function speakBtn(what){
    return canSpeak ? '<button class="speak-btn" data-speak="' + what + '" title="朗读" aria-label="朗读">🔊</button>' : '';
  }

  // ---------- rendering ----------
  function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function todayStats(){
    ensureDailyProgress();
    return {
      newDone: state.dailyProgress.newIntroducedCount,
      newGoal: dailyNewQuota(),
      dueRemaining: dueReviews().length + againToday().length   // all books, incl. same-day re-checks
    };
  }

  function bookName(id){
    var b = allBooks().filter(function(x){ return x.id === id; })[0];
    return b ? b.name : '词库';
  }
  function activeBookName(){ return bookName(state.activeBook); }

  // Label above the card: test mode, plus the unit, or which book a cross-book review came from.
  function cardTag(w, modeLabel){
    var extra = '';
    if(w.book !== state.activeBook) extra = ' · 复习' + bookName(w.book);
    else if(w.unit) extra = ' · Unit ' + w.unit;
    if(ui.currentRecheck) extra += ' · 再考一遍';
    return '<div class="fc-mode">' + modeLabel + escapeHtml(extra) + '</div>';
  }

  // Phonetic + common phrases from wordbooks-extra.js (window.WORD_EXTRAS), looked up by
  // the word's first spelling; not copied into saved progress.
  function wordExtras(w){
    var key = w.en.split('/')[0].replace(/\([^)]*\)/g, '').toLowerCase();
    return (window.WORD_EXTRAS || {})[key] || null;
  }
  function renderPhonetic(w){
    var x = wordExtras(w);
    return x && x[0] ? '<div class="fc-phonetic">美 /' + escapeHtml(x[0]) + '/</div>' : '';
  }
  function renderPhrases(w){
    var x = wordExtras(w);
    if(!x || !x[1] || !x[1].length) return '';
    return '<div class="fc-phrases"><div class="fc-phrases-title">常用短语</div>' + x[1].map(function(p){
      return '<div class="fc-phrase"><span class="en">' + escapeHtml(p[0]) + '</span> ' + escapeHtml(p[1]) + '</div>';
    }).join('') + '</div>';
  }

  function renderHeader(c){
    var t = todayStats();
    var pct = t.newGoal > 0 ? Math.min(100, Math.round(t.newDone / t.newGoal * 100)) : 0;
    var theme = themeInfo(resolvedTheme());
    var range = unitRange(state.activeBook);
    var rangeText = range && range.limited ? ' &nbsp;·&nbsp; 范围 ' + unitRangeLabel(range) : '';
    return '' +
    '<div class="cover">' +
      '<div class="cover-title"><h1><span class="nowrap">' + escapeHtml(activeBookName()) + ' ·</span> <span class="nowrap">错词抄写本</span></h1></div>' +
      '<div class="cover-side">' +
        '<button class="theme-btn" data-act="theme" title="切换颜色" aria-label="切换颜色，当前：' + theme.name + '">' +
          theme.icon + '<span class="theme-name"> ' + theme.name + '</span></button>' +
        '<div class="stamp"><div class="num">' + displayStreak() + '</div><div class="lbl">连续天数</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="daily-bar">' +
      '<div class="daily-text">今日新词 ' + t.newDone + '/' + t.newGoal + ' &nbsp;·&nbsp; 待复习 ' + t.dueRemaining + rangeText + '</div>' +
      '<div class="daily-track"><div class="daily-fill" style="width:' + pct + '%"></div></div>' +
    '</div>' +
    '<div class="tally">' +
      '<div class="item"><div class="n">' + c.new + '</div><div class="l">新词</div></div>' +
      '<div class="item"><div class="n">' + c.learning + '</div><div class="l">学习中</div></div>' +
      '<div class="item"><div class="n">' + c.mastered + '</div><div class="l">已掌握</div></div>' +
      '<div class="item"><div class="n">' + c.wrongbook + '</div><div class="l">错词本</div></div>' +
    '</div>';
  }

  function renderTabs(){
    var tabs = [['study','背单词'],['books','词书'],['wrongbook','错词本'],['import','导入'],['settings','设置']];
    return '<div class="tabs">' + tabs.map(function(t){
      return '<button class="tab-btn' + (ui.activeTab===t[0]?' active':'') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';
  }

  function renderBooksTab(){
    var books = allBooks();
    var rows = books.map(function(b){
      ensureBookLoaded(b.id);
      var bookWords = state.words.filter(function(w){ return w.book === b.id; });
      var total = bookWords.length;
      var learned = bookWords.filter(function(w){ return w.introducedDate; }).length;
      var mastered = bookWords.filter(function(w){ return wordStatus(w) === 'mastered'; }).length;
      var isActive = (b.id === state.activeBook);
      var units = bookUnitCount(b.id);
      var range = unitRange(b.id);
      var left = remainingNewWords(b.id);
      var perDay = state.settings.dailyNewGoal || 0;
      var plan = left === 0
        ? (range && range.limited ? unitRangeLabel(range) + ' 的新词已全部学过' : '新词已全部学过')
        : (range && range.limited ? unitRangeLabel(range) + ' 还剩 ' + left + ' 个新词，' : '') +
          '按每天 ' + perDay + ' 个约 ' + daysToFinish(left, perDay) + ' 天学完';
      var badge = b.builtin ? '<span class="book-badge">内置</span>' : '<span class="book-badge custom">自建</span>';
      var actives = isActive ? '<span class="book-current">当前学习</span>' : '<button class="mini-btn book-select" data-book="' + escapeHtml(b.id) + '">选它来背</button>';
      return '<div class="book-row' + (isActive ? ' active' : '') + '">' +
          '<div class="book-main">' +
            '<div class="book-name">' + escapeHtml(b.name) + ' ' + badge + '</div>' +
            '<div class="book-stat">共 ' + total + ' 词' + (units ? ' · ' + units + ' 个单元' : '') + ' · 学过 ' + learned + ' · 已掌握 ' + mastered + '</div>' +
            '<div class="book-stat">' + plan + '</div>' +
          '</div>' +
          '<div class="book-action">' + actives + '</div>' +
          (units ? '<div class="book-extra">' + renderUnitRangePicker(b.id) + '</div>' : '') +
        '</div>';
    }).join('');
    return '<div class="paper">' +
      '<div class="copy-title" style="margin-bottom:12px;">选择要背的词书</div>' +
      '<div class="hint" style="margin-bottom:14px;">切换词书后，"背单词"页会只考当前这本里的词。每本词书的学习进度各自独立保存，随时切换互不影响。想加考研、雅思等其它词表，去"导入"页添加。</div>' +
      rows +
    '</div>';
  }

  function renderExample(w){
    if(!w.example) return '';
    var html = '<div class="fc-example">' + escapeHtml(w.example) + speakBtn('example') + '</div>';
    if(w.exampleCn){
      html += '<div class="fc-example-cn">' + escapeHtml(w.exampleCn) + '</div>';
    }
    return '<div class="fc-ex">' + html + '</div>';
  }

  function renderStudyTab(){
    if(ui.copyTask) return renderCopyTask();
    if(activeWords().length === 0){
      return '<div class="paper"><div class="empty">这本词书还没有单词。去"词书"页换一本，或到"导入"页添加自己的词表。</div></div>';
    }
    if(!ui.currentWord) nextCard();
    var w = ui.currentWord;
    if(!w){
      if(ui.bonusMode){
        return '<div class="paper"><div class="empty">已经没有学过的词可以额外练习啦，明天再来吧～</div></div>';
      }
      // If the day's quota isn't used up only because the chosen units ran out, say so.
      var range = unitRange(state.activeBook);
      var rangeDone = range && range.limited && todayStats().newDone < todayStats().newGoal && remainingNewWords(state.activeBook) === 0
        ? '<div class="msg-line">' + unitRangeLabel(range) + ' 的新词已经全部学过了，想学新的可以去"词书"页放宽背诵范围。</div>' : '';
      var moreNew = remainingNewWords(state.activeBook) > 0
        ? '<button class="btn btn-primary" data-act="more-new">再学 10 个新词</button>' : '';
      return '<div class="paper"><div class="done-screen">' +
        '<div class="big">🎉</div>' +
        '<div class="msg-line">今天的新词和复习任务都完成啦</div>' + rangeDone +
        '<div class="btn-row">' + moreNew +
          '<button class="btn btn-ghost" data-act="bonus-start">复习学过的词（不计入今日目标）</button>' +
        '</div>' +
      '</div></div>';
    }
    var mode = ui.currentMode;
    var body = '';
    if(mode === 'en2zh'){
      body += cardTag(w, '英译中');
      body += '<div class="fc-word">' + escapeHtml(w.en) + speakBtn('word') + '</div>';
      body += renderPhonetic(w);
      // "不知道" answers without revealing first, so a graded card always shows the meaning.
      if(!ui.revealAnswer && !ui.feedback){
        body += '<div class="btn-row">' +
          '<button class="btn btn-primary" data-act="reveal">显示释义</button>' +
          '<button class="btn btn-ghost" data-act="dont-know">不知道</button>' +
        '</div>';
      } else {
        body += '<div class="fc-reveal">' + escapeHtml(w.zh) + '</div>';
        body += renderExample(w);
        body += renderPhrases(w);
        if(!ui.feedback){
          body += '<div class="btn-row">' +
            '<button class="btn btn-green" data-act="self-correct">我答对了</button>' +
            '<button class="btn btn-red" data-act="self-wrong">我答错了</button>' +
          '</div>';
        }
      }
    } else {
      body += cardTag(w, '中译英');
      body += '<div class="fc-word fc-word-zh">' + escapeHtml(w.zh) + '</div>';
      // In 中译英, the example, phonetic and phrases all give the word away, so they're only
      // shown once the user has answered — below the feedback line, which holds the answer.
      if(!ui.feedback){
        // autocorrect / suggestions off: the phone keyboard would otherwise fix a misspelling
        // (marked correct) or show the answer in its suggestion bar.
        body += '<div class="btn-row"><input type="text" id="spell-input" placeholder="拼写英文单词" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>';
        body += '<div class="fc-hint" id="spell-hint"' + (ui.hintShown ? '' : ' hidden') + '>' + escapeHtml(spellingHint(w.en)) + '</div>';
        body += '<div class="btn-row">' +
          '<button class="btn btn-primary" data-act="submit-spell">提交</button>' +
          '<button class="btn btn-ghost" data-act="hint"' + (ui.hintShown ? ' disabled' : '') + '>提示</button>' +
          '<button class="btn btn-ghost" data-act="dont-know">不知道</button>' +
        '</div>';
      }
    }
    if(ui.feedback){
      // In 中译英 the English word only appears in the feedback, so its 🔊 goes there.
      var feedbackSpeak = (mode === 'zh2en' && ui.feedback.type === 'wrong') ? speakBtn('word') : '';
      body += '<div class="feedback ' + ui.feedback.type + '">' + escapeHtml(ui.feedback.text) + feedbackSpeak + '</div>';
      if(mode === 'zh2en') body += renderPhonetic(w) + renderExample(w) + renderPhrases(w);
      if(ui.feedback.type === 'wrong'){
        body += '<div class="btn-row"><button class="btn btn-primary" data-act="next-card">' +
          (needsCopyTask(w) ? 'OK，去抄写' : 'OK，下一个') + '</button></div>';
      }
    }
    return '<div class="paper"><div class="flashcard">' + body + '</div></div>';
  }

  function renderCopyTask(){
    var ct = ui.copyTask;
    var word = ct.word;
    var handwrite = (state.settings.copyMode === 'handwrite');
    var letters = word.en.split('');
    var rows = '';
    for(var r=0;r<3;r++){
      var mark = ct.repsDone[r] ? '<span class="rep-mark ok">✓</span>' : '<span class="rep-mark">&nbsp;</span>';
      var cells = '';
      if(ct.repsDone[r]){
        letters.forEach(function(ch){ cells += '<div class="cell done">' + escapeHtml(ch) + '</div>'; });
      } else if(!handwrite && r === ct.activeRep){
        var typed = (ct.input||'');
        letters.forEach(function(ch, i){
          var shown = typed[i] ? escapeHtml(typed[i]) : '';
          cells += '<div class="cell' + (typed[i] ? '' : ' pending') + '">' + shown + '</div>';
        });
      } else {
        letters.forEach(function(){ cells += '<div class="cell pending"></div>'; });
      }
      rows += '<div class="grid-row" data-rep="' + r + '"><div class="rep-label">' + (r+1) + '</div>' + cells + mark + '</div>';
    }
    var errMsg = ct.error ? '<div class="msg warn">拼错啦，再试一次这一遍～</div>' : '';

    if(handwrite){
      return '<div class="paper">' +
        '<div class="copy-title">这个词错太多次了，请在纸上工整抄写 3 遍：<span style="font-family:var(--font-mono)">' + escapeHtml(word.en) + '</span>' + speakBtn('word') + '</div>' +
        '<div class="copy-sub">' + escapeHtml(word.zh) + ' · 在纸上抄完 3 遍后，点下面的按钮</div>' +
        rows +
        '<div class="btn-row" style="margin-top:16px;">' +
          '<button class="btn btn-green" data-act="handwrite-done">我抄完了</button>' +
        '</div>' +
      '</div>';
    }

    return '<div class="paper">' +
      '<div class="copy-title">这个词错太多次了，工整抄写 3 遍：<span style="font-family:var(--font-mono)">' + escapeHtml(word.en) + '</span>' + speakBtn('word') + '</div>' +
      '<div class="copy-sub">' + escapeHtml(word.zh) + ' · 抄对才算一遍，抄错不计数</div>' +
      rows +
      errMsg +
      '<div class="copy-input-wrap"><input type="text" id="copy-input" placeholder="在此输入，回车确认" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>' +
    '</div>';
  }

  function renderWrongBookTab(){
    var list = activeWords().filter(function(w){ return w.wrongCount>0; })
      .sort(function(a,b){ return b.wrongCount - a.wrongCount; });

    }
    var rows = list.map(function(w){
      return '<div class="word-row">' +
        '<span class="en">' + escapeHtml(w.en) + '</span>' +

  // Only for books split into units (词达人四级), shown in that book's row on the 词书 page:
  // pick which units new words come from. Saved as soon as it changes.
  function renderUnitRangePicker(bookId){
    var r = unitRange(bookId);
    if(!r) return '';
    function select(end, value){
      var opts = '';
      for(var i = 1; i <= r.total; i++){
        opts += '<option value="' + i + '"' + (i === value ? ' selected' : '') + '>Unit ' + i + '</option>';
      }
      return '<select class="unit-select" data-book="' + escapeHtml(bookId) + '" data-end="' + end + '">' + opts + '</select>';
    }
    return '<div class="unit-range">背诵范围 ' + select('from', r.from) + ' 到 ' + select('to', r.to) + '</div>' +
      '<div class="book-stat">新词只从这几个单元里出，学过的词照常复习。</div>';
  }

  function renderStorageWarning(){
    return '<div class="warn-banner">⚠️ 当前浏览器不允许本地存储（可能处于无痕模式，或存储被禁用），你的学习记录和词库<b>不会保存</b>。请换成普通浏览模式打开，或检查浏览器隐私设置。</div>';

  function render(){
    var app = document.getElementById('app');
    var c = counts();
    var body = '';
    if(ui.activeTab === 'study') body = renderStudyTab();
    else if(ui.activeTab === 'books') body = renderBooksTab();
    else if(ui.activeTab === 'wrongbook') body = renderWrongBookTab();
    else if(ui.activeTab === 'import') body = renderImportTab();
    else body = renderSettingsTab();

    var saveWarn = ui.saveFailed ? '<div class="warn-banner">⚠️ 刚才的学习进度<b>没能保存</b>，可能是浏览器存储空间满了。可以清理一下浏览器的缓存和网站数据（注意别清掉本网站的），或者到"导入"页用"替换自建词库"删掉用不到的自建词。</div>' : '';
    app.innerHTML = (ui.storageAvailable ? '' : renderStorageWarning()) + saveWarn + renderHeader(c) + renderTabs() + body;
    bindEvents();

    // focus inputs for a smoother typing flow
    var spellInput = document.getElementById('spell-input');
    if(spellInput) spellInput.focus();
    var copyInput = document.getElementById('copy-input');
    if(copyInput){ copyInput.value = ui.copyTask.input || ''; copyInput.focus(); copyInput.setSelectionRange(copyInput.value.length, copyInput.value.length); }
  }

  function bindEvents(){
    var app = document.getElementById('app');

    app.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.onclick = function(){
        ui.activeTab = btn.getAttribute('data-tab');
        ui.currentWord = null; ui.feedback = null; ui.revealAnswer = false; ui.copyTask = null; ui.importMsg = null; ui.backupMsg = null; ui.bonusMode = false;
        render();
      };
    });

    app.querySelectorAll('.book-select').forEach(function(btn){
      btn.onclick = async function(){
        var bookId = btn.getAttribute('data-book');
        ensureBookLoaded(bookId);
        state.activeBook = bookId;
        ui.currentWord = null; ui.feedback = null; ui.revealAnswer = false; ui.copyTask = null; ui.bonusMode = false;
        ui.activeTab = 'study';
        await persist();
        render();
      };
    });

    var bonusStart = app.querySelector('[data-act="bonus-start"]');
    if(bonusStart) bonusStart.onclick = function(){ ui.bonusMode = true; nextCard(); render(); };

    // Done screen: 10 more new words, for today only (dailyProgress resets tomorrow).
    var moreNew = app.querySelector('[data-act="more-new"]');
    if(moreNew) moreNew.onclick = async function(){
      ensureDailyProgress();
      state.dailyProgress.extraNew = (state.dailyProgress.extraNew || 0) + 10;
      await persist();
      nextCard();
      render();
    };

    var revealBtn = app.querySelector('[data-act="reveal"]');
    if(revealBtn) revealBtn.onclick = function(){ ui.revealAnswer = true; render(); };

    var dontKnow = app.querySelector('[data-act="dont-know"]');
    if(dontKnow) dontKnow.onclick = function(){ grade(ui.currentWord, false); };

    var selfCorrect = app.querySelector('[data-act="self-correct"]');
    if(selfCorrect) selfCorrect.onclick = function(){ grade(ui.currentWord, true); };
    var selfWrong = app.querySelector('[data-act="self-wrong"]');
    if(selfWrong) selfWrong.onclick = function(){ grade(ui.currentWord, false); };

    var nextCardBtn = app.querySelector('[data-act="next-card"]');
    if(nextCardBtn) nextCardBtn.onclick = continueAfterWrong;

    var submitSpell = app.querySelector('[data-act="submit-spell"]');
    var spellInput = document.getElementById('spell-input');
    function doSubmitSpell(){
      if(!spellInput) return;
      var val = spellInput.value.trim();
      if(!val) return;
      grade(ui.currentWord, spellingMatches(val, ui.currentWord.en));
    }
    if(submitSpell) submitSpell.onclick = doSubmitSpell;
    if(spellInput) spellInput.addEventListener('keydown', function(e){
      // Same IME guard as the copy input: the Enter that commits a pinyin/IME candidate
      // must not submit a half-typed answer.
      if(e.isComposing || e.keyCode === 229) return;
      if(e.key === 'Enter') doSubmitSpell();
    });

    var hintBtn = app.querySelector('[data-act="hint"]');
    if(hintBtn) hintBtn.onclick = function(){
      // Reveal in place instead of re-rendering, so letters already typed stay in the box.
      ui.hintShown = true;
      var hint = document.getElementById('spell-hint');
      if(hint) hint.hidden = false;
      hintBtn.disabled = true;
      if(spellInput) spellInput.focus();
    };

    app.querySelectorAll('[data-speak]').forEach(function(btn){
      btn.onclick = function(){
        var w = ui.copyTask ? ui.copyTask.word : ui.currentWord;
        if(!w) return;
        speak(btn.getAttribute('data-speak') === 'example' ? w.example : w.en.split('/')[0].replace(/[()]/g, ''));
      };
    });

    var copyInput = document.getElementById('copy-input');
    if(copyInput){
      copyInput.addEventListener('input', function(){
        ui.copyTask.input = copyInput.value;
        var cells = app.querySelectorAll('.grid-row[data-rep="' + ui.copyTask.activeRep + '"] .cell');
        // lightweight live update without full re-render for smoother typing
        var letters = ui.copyTask.input.split('');
        cells.forEach(function(cell, i){
          if(letters[i]){ cell.textContent = letters[i]; cell.classList.remove('pending'); }
          else { cell.textContent=''; cell.classList.add('pending'); }
        });
      });
      copyInput.addEventListener('keydown', function(e){
        // When a Chinese/pinyin IME is active, the first Enter only confirms the IME's
        // candidate and fires with isComposing=true (or keyCode 229). Ignoring those means
        // one Enter = one submission, so "抄写3遍" really needs 3 presses, not 6.
        if(e.isComposing || e.keyCode === 229) return;
        if(e.key === 'Enter'){
          submitCopyRep(copyInput.value);
          copyInput.value='';
          if(ui.copyTask) ui.copyTask.input='';
        }
      });
    }

    var handwriteDone = app.querySelector('[data-act="handwrite-done"]');
    if(handwriteDone) handwriteDone.onclick = function(){ markHandwriteRep(); };

    app.querySelectorAll('[data-act="practice"]').forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute('data-id');
        var w = state.words.find(function(x){ return x.id === id; });
        if(w){ ui.activeTab='study'; startCopyTask(w); }
      };
    });

    var importFile = document.getElementById('import-file');
    if(importFile) importFile.addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        ui.importDraftText = ev.target.result;
        ui.importMsg = { type:'ok', text:'已读取文件"' + file.name + '"，请确认内容后点击下方按钮导入。' };
        render();
      };
      reader.onerror = function(){
        ui.importMsg = { type:'warn', text:'文件读取失败，请重试，或直接把内容粘贴到文本框里。' };
        render();
      };
      reader.readAsText(file, 'UTF-8');
    });
    var importTextArea = document.getElementById('import-text');
    if(importTextArea) importTextArea.addEventListener('input', function(){ ui.importDraftText = importTextArea.value; });

    var importAppend = app.querySelector('[data-act="import-append"]');
    if(importAppend) importAppend.onclick = function(){ doImport(false); };
    var importReplace = app.querySelector('[data-act="import-replace"]');
    if(importReplace) importReplace.onclick = function(){ doImport(true); };

    var themeBtn = app.querySelector('[data-act="theme"]');
    if(themeBtn) themeBtn.onclick = cycleTheme;
    app.querySelectorAll('input[name="theme"]').forEach(function(radio){
      radio.onchange = function(){ if(radio.checked) setTheme(radio.value); };
    });

    // 词书 page: unit range picker of a book with units. Saved right away; keeps from <= to.
    app.querySelectorAll('.unit-select').forEach(function(sel){
      sel.addEventListener('change', async function(){
        var bookId = sel.getAttribute('data-book');
        var pair = app.querySelectorAll('.unit-select[data-book="' + bookId + '"]');
        var a = parseInt(pair[0].value, 10), b = parseInt(pair[1].value, 10);
        state.settings.unitRange[bookId] = { from: Math.min(a, b), to: Math.max(a, b) };
        if(bookId === state.activeBook) ui.currentWord = null;   // the card on screen may be outside the new range
        await persist();
        render();
      });
    });

    // Live "about N days to finish" while the daily goal is being changed.
    var goalInput = document.getElementById('daily-goal-input');
    var estimate = document.getElementById('finish-estimate');
    function updateEstimate(){
      if(!estimate) return;
      var g = parseInt(goalInput.value, 10);
      if(!(g >= 1 && g <= 200)){ estimate.textContent = '请输入 1～200 之间的数字。'; return; }
      estimate.innerHTML = finishEstimateText(state.activeBook, g);
    }
    // Settings save as soon as they change. There used to be a "保存设置" button at the bottom;
    // people changed a value, left the page without pressing it, and lost the change.
    // Out-of-range numbers are not saved; the field snaps back when it loses focus.
    function readSettingsForm(){
      var s = state.settings;
      var g = parseInt(goalInput.value, 10);
      if(g >= 1 && g <= 200) s.dailyNewGoal = g;
      var t = parseInt(document.getElementById('threshold-input').value, 10);
      if(t >= 1 && t <= 5) s.threshold = t;
      s.modeEn2Zh = document.getElementById('mode-en2zh').checked;
      s.modeZh2En = document.getElementById('mode-zh2en').checked;
      var cm = app.querySelector('input[name="copymode"]:checked');
      if(cm) s.copyMode = cm.value;
    }
    async function saveSettingsForm(rerender){
      readSettingsForm();
      await persist();
      if(rerender) render();
      var note = document.getElementById('save-note');
      if(note){
        note.textContent = '✓ 已保存';
        note.classList.add('saved');
        clearTimeout(ui.saveNoteTimer);
        ui.saveNoteTimer = setTimeout(function(){
          var n = document.getElementById('save-note');
          if(n){ n.textContent = '所有设置改了就自动保存，不用另外点保存。'; n.classList.remove('saved'); }
        }, 1500);
      }
    }
    // Number fields save while typing without re-rendering (keeps the cursor, and a re-render
    // on blur would swallow a tap on another tab). When left with an invalid number, put the
    // saved value back.
    function numberField(input, min, max, key){
      if(!input) return;
      input.addEventListener('input', function(){ updateEstimate(); saveSettingsForm(false); });
      input.addEventListener('change', function(){
        var v = parseInt(input.value, 10);
        if(!(v >= min && v <= max)){ input.value = state.settings[key]; updateEstimate(); }
      });
    }
    numberField(goalInput, 1, 200, 'dailyNewGoal');
    numberField(document.getElementById('threshold-input'), 1, 5, 'threshold');
    app.querySelectorAll('#mode-en2zh, #mode-zh2en, input[name="copymode"]').forEach(function(el){
      el.addEventListener('change', function(){ saveSettingsForm(true); });
    });
    // Backup: the whole saved state (progress, settings, imported words) plus the color theme,
    // as a JSON file. Restoring replaces everything on this device.
    var exportBtn = app.querySelector('[data-act="export-backup"]');
    if(exportBtn) exportBtn.onclick = function(){
      var data = JSON.stringify({ app: 'vocab-pwa', version: 1, exportedAt: new Date().toISOString(), theme: themeSetting(), state: state });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      a.download = 'vocab-backup-' + todayStr() + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      var learned = state.words.filter(function(w){ return w.introducedDate; }).length;
      ui.backupMsg = { type: 'ok', text: '已导出备份（' + learned + ' 个学过的词）。文件名是 ' + a.download + '，存到网盘或发给自己保存好。' };
      render();
    };
    var importBackup = document.getElementById('import-backup');
    if(importBackup) importBackup.addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = async function(ev){
        var parsed = null;
        try{ parsed = JSON.parse(ev.target.result); }catch(err){}
        var s = parsed && (parsed.state || parsed);
        if(!s || !Array.isArray(s.words)){
          ui.backupMsg = { type: 'warn', text: '这个文件不是本应用导出的备份，没有恢复。' };
          render();
          return;
        }
        var learned = s.words.filter(function(w){ return w.introducedDate; }).length;
        if(!confirm('用这个备份（' + learned + ' 个学过的词）覆盖这台设备上现在的全部学习记录和设置吗？')) return;
        state = s;
        migrateState();
        if(parsed.theme){ try{ localStorage.setItem(THEME_KEY, parsed.theme); }catch(err){} applyTheme(); }
        await persist();
        ui.currentWord = null; ui.feedback = null; ui.copyTask = null; ui.bonusMode = false;
        ui.backupMsg = { type: 'ok', text: '已从备份恢复：' + learned + ' 个学过的词。' };
        render();
      };
      reader.onerror = function(){ ui.backupMsg = { type: 'warn', text: '文件读取失败，请重试。' }; render(); };
      reader.readAsText(file, 'UTF-8');
    });

    var resetAll = app.querySelector('[data-act="reset-all"]');
    if(resetAll) resetAll.onclick = async function(){
      if(!confirm('确定要清空所有词书的学习进度（包括自建词库的内容）吗？此操作不可撤销。')) return;
      state = defaultState();
      ensureBookLoaded(state.activeBook);
      await persist();
      ui.activeTab='study'; ui.currentWord=null; ui.currentMode=null; ui.revealAnswer=false;
      ui.feedback=null; ui.copyTask=null; ui.importMsg=null; ui.importDraftText=''; ui.bonusMode=false;
      render();
    };
  }

  function parseLine(line){
    var parts = null;
    if(line.indexOf('\t') !== -1) parts = line.split('\t');
    else if(line.indexOf(',') !== -1) parts = line.split(',');
    else if(line.indexOf(' - ') !== -1) parts = line.split(' - ');
    else if(line.indexOf('：') !== -1) parts = line.split('：');
    else if(line.indexOf(':') !== -1) parts = line.split(':');
    if(!parts || parts.length < 2) return null;
    var en = parts[0].trim();
    var zh = parts[1].trim();
    var example = parts.length > 2 ? parts.slice(2).join(',').trim() : '';
    if(!en || !zh) return null;
    return makeWord(CUSTOM_BOOK_ID, en, zh, example);
  }

  async function doImport(replace){
    var text = document.getElementById('import-text').value;
    var lines = text.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length;});
    var added = 0, skipped = 0, parsedWords = [];
    lines.forEach(function(line){
      var w = parseLine(line);
      if(w) parsedWords.push(w); else skipped++;
    });
    if(parsedWords.length === 0){
      ui.importMsg = { type:'warn', text:'没有识别到有效的词条，请检查格式后重试。' };
      render();
      return;
    }
    if(replace){
      if(!confirm('确定要替换"' + (state.customBookName||'我的词库') + '"里的全部内容吗？这本自建词书的学习进度会清空（内置词书不受影响）。')) return;
      // Drop only custom-book words, keep built-in book progress intact.
      state.words = state.words.filter(function(w){ return w.book !== CUSTOM_BOOK_ID; });
      parsedWords.forEach(function(w){ state.words.push(w); });
      added = parsedWords.length;
    } else {
      var existingIds = {};
      state.words.forEach(function(w){ existingIds[w.id] = true; });
      parsedWords.forEach(function(w){
        if(!existingIds[w.id]){ state.words.push(w); existingIds[w.id]=true; added++; }
        else skipped++;
      });
    }
    state.loadedBooks[CUSTOM_BOOK_ID] = true;
    await persist();
    ui.importDraftText = '';
    ui.importMsg = { type:'ok', text:'成功导入 ' + added + ' 个新词到"' + escapeHtml(state.customBookName||'我的词库') + '"' + (skipped? '，跳过 ' + skipped + ' 行（重复或格式不对）':'') + '。到"词书"页选它就能开始背。' };
    render();
  }

  async function init(){
    applyTheme();
    // In 'auto', follow the system switching between light and dark while the app is open.
    // Also re-check when the app comes back to the foreground (e.g. after flipping dark mode
    // in the phone's control center), in case the change event was missed.
    if(darkQuery){
      var onSystemTheme = function(){
        if(themeSetting() !== 'auto' || document.documentElement.getAttribute('data-theme') === resolvedTheme()) return;
        applyTheme();
        if(state) render();
      };
      if(darkQuery.addEventListener) darkQuery.addEventListener('change', onSystemTheme);
      else if(darkQuery.addListener) darkQuery.addListener(onSystemTheme);
      document.addEventListener('visibilitychange', function(){ if(!document.hidden) onSystemTheme(); });
    }
    ui.storageAvailable = storageOK;
    await loadState();
    ensureBookLoaded(state.activeBook);  // make sure the active book's words are present (fresh install or after load)
    await persist();
    render();

    window.addEventListener('storage', function(e){ if(e.key === STORAGE_KEY) reloadIfChangedElsewhere(); });
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) reloadIfChangedElsewhere(); });

    // Enter on the wrong-answer screen = OK. The Enter that submitted a spelling bubbles up
    // here right after the screen appears, so ignore anything within the first moment.
    document.addEventListener('keydown', function(e){
      if(e.key !== 'Enter' || e.repeat || e.isComposing || e.keyCode === 229) return;
      var btn = document.querySelector('[data-act="next-card"]');
      if(!btn || Date.now() - ui.feedbackShownAt < 400) return;
      e.preventDefault();
      btn.click();
    });
  }

  init();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(err){
        console.warn('Service worker registration failed:', err);
      });
    });
  }
})();
</script>
</body>
</html>
